<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wide — weight-space explorer (prototype)</title>
<meta name="description" content="Prototype of Wide's weight-space explorer: a searchable grid of weight tables, a premise graph for any weight, and a retraction simulator over an exact mock session.">
<meta name="color-scheme" content="dark">
<style>
:root {
  --bg: #0b0e12;
  --bg-2: #0e1218;
  --panel: #12171e;
  --panel-2: #151b23;
  --raise: #1a212a;
  --line: #212934;
  --line-2: #2c3644;
  --ink: #dde4ec;
  --ink-2: #b6c1cd;
  --ink-3: #97a2b0;
  --ink-4: #7a8493;
  --accent: #ffb84d;
  --accent-dim: rgba(255, 184, 77, 0.16);
  --mint: #6fe3b4;
  --rose: #ff7189;
  --violet: #b79cff;
  --steel: #8ba6c9;
  --pink: #f2a2c2;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  --r: 10px;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 460px at 18% -12%, rgba(255, 184, 77, 0.07), transparent 65%),
    radial-gradient(900px 420px at 100% 0%, rgba(111, 227, 180, 0.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #232c37; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------------- shell */
.shell { min-height: 100%; display: flex; flex-direction: column; overflow-x: hidden; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 0 20px; height: 58px; overflow: hidden;
  background: rgba(11, 14, 18, 0.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 11px; flex: 0 1 auto; min-width: 0; }
.brand .glyph { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.brand .glyph i { display: block; width: 3px; background: var(--accent); border-radius: 1px; }
.brand .glyph i:nth-child(1) { height: 8px; opacity: 0.55; }
.brand .glyph i:nth-child(2) { height: 13px; opacity: 0.75; }
.brand .glyph i:nth-child(3) { height: 18px; }
.brand .glyph i:nth-child(4) { height: 11px; opacity: 0.65; }
.brand .word { font-family: var(--mono); font-size: 15px; letter-spacing: 0.3em; font-weight: 600; }
.brand .sub { color: var(--ink-3); font-size: 12px; letter-spacing: 0.04em; padding-left: 3px; white-space: nowrap; }
@media (max-width: 860px) { .brand .sub { display: none; } }
@media (max-width: 520px) { .topbar .chip.mock { display: none; } .topbar { gap: 10px; padding: 0 14px; } }

.sesspill {
  display: none; align-items: center; gap: 8px; flex: none;
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
  background: var(--panel);
}
@media (min-width: 1180px) { .sesspill { display: flex; } }
.sesspill .dotsep { color: var(--ink-4); }

.spacer { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--line-2); color: var(--ink-2); background: var(--panel);
  white-space: nowrap;
}
.chip.mock { color: var(--accent); border-color: rgba(255, 184, 77, 0.35); background: var(--accent-dim); }
.chip.live { color: var(--mint); border-color: rgba(111, 227, 180, 0.3); background: rgba(111, 227, 180, 0.08); }
.chip.warn { color: var(--rose); border-color: rgba(255, 113, 137, 0.34); background: rgba(255, 113, 137, 0.09); }
.chip.quiet { color: var(--ink-3); }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line-2); background: var(--panel);
  color: var(--ink); border-radius: 8px; padding: 7px 12px;
  font-size: 12.5px; transition: border-color .14s, background .14s, color .14s;
}
.btn:hover { border-color: #3a4757; background: var(--raise); }
.btn:focus-visible, .node:focus-visible, .tab:focus-visible, .wcard:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn.primary { background: var(--accent); color: #1a1204; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: #ffc86b; }
.btn.danger { color: var(--rose); border-color: rgba(255, 113, 137, 0.4); background: rgba(255, 113, 137, 0.08); }
.btn.danger:hover { background: rgba(255, 113, 137, 0.16); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel); color: var(--ink); }
.btn.sm { padding: 4px 9px; font-size: 11.5px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-4); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }

.tabs {
  display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; max-width: 100vw;
  background: rgba(11, 14, 18, 0.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); position: sticky; top: 58px; z-index: 35;
}
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--ink-3); padding: 11px 12px 9px; font-size: 13px; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
.tab[aria-selected="true"] .count { color: var(--accent); }

main { flex: 1; padding: 22px 20px 60px; max-width: 1560px; width: 100%; margin: 0 auto; min-width: 0; }
@media (max-width: 520px) { main { padding: 16px 12px 48px; } }

/* --------------------------------------------------------------- header */
.vhead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.vhead h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.vhead h1.mono { font-family: var(--mono); font-size: 17px; letter-spacing: 0; word-break: break-all; }
.vhead .lede { color: var(--ink-2); font-size: 13px; max-width: 74ch; margin: 4px 0 0; }
.vhead .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.crumb { font-family: var(--mono); font-size: 11px; color: var(--ink-4); margin-bottom: 6px; }
.crumb button { background: none; border: 0; color: var(--ink-3); padding: 0; font-family: inherit; font-size: inherit; }
.crumb button:hover { color: var(--accent); }

/* ---------------------------------------------------------------- panel */
.panel {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--r);
  padding: 16px;
}
.panel h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.13em;
  color: var(--ink-3); margin: 0 0 12px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.panel h2 .tag { font-family: var(--mono); text-transform: none; letter-spacing: 0; color: var(--ink-4); font-weight: 400; }
.panel .muted { color: var(--ink-3); }

/* -------------------------------------------------------------- toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); margin-bottom: 14px;
}
.search { position: relative; flex: 1 1 260px; min-width: 200px; }
.search input {
  width: 100%; padding: 8px 10px 8px 30px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink);
  font-family: var(--mono); font-size: 12.5px;
}
.search input::placeholder { color: var(--ink-4); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); }
select.ctl, input.ctl {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--bg-2); color: var(--ink-2); font-size: 12.5px;
}
select.ctl:focus, input.ctl:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); }
.tbcount { font-family: var(--mono); font-size: 11px; color: var(--ink-4); margin-left: auto; padding-right: 4px; }

/* ---------------------------------------------------------------- stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); padding: 10px 12px; }
.stat .k { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-4); }
.stat .v { font-family: var(--mono); font-size: 19px; margin-top: 3px; }
.stat .s { font-size: 11px; color: var(--ink-3); }

/* ----------------------------------------------------------------- grid */
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(306px, 1fr)); gap: 11px; }
.wcard {
  text-align: left; width: 100%;
  border: 1px solid var(--line); border-radius: var(--r); background:
    linear-gradient(180deg, #12171e 0%, #0f141a 100%);
  padding: 12px; color: inherit; transition: border-color .14s, transform .14s, box-shadow .14s;
  display: flex; flex-direction: column; gap: 9px; min-width: 0;
}
.wcard:hover { border-color: #3b4757; transform: translateY(-1px); box-shadow: 0 10px 26px rgba(0,0,0,.32); }
.wcard[data-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(255,184,77,.3) inset; }
.wcard .top { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.wcard .nm { font-family: var(--mono); font-size: 12.5px; color: var(--ink); word-break: break-all; line-height: 1.35; flex: 1; min-width: 0; }
.wcard .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.wcard .chips .chip { padding: 2px 6px; font-size: 9.5px; letter-spacing: .05em; }
.wcard .vals { display: flex; align-items: flex-end; gap: 12px; }
.wcard .val { font-family: var(--mono); }
.wcard .val .n { font-size: 17px; }
.wcard .val .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-4); }
.wcard .spark { margin-left: auto; }
.wcard .foot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-top: 1px solid var(--line); padding-top: 8px; margin-top: auto;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
}
.wcard .foot .aff { color: var(--rose); }
.wcard .foot .dg { color: var(--ink-4); margin-left: auto; }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.ok { background: var(--mint); box-shadow: 0 0 0 3px rgba(111,227,180,.12); }
.dot.partial { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,184,77,.12); }
.dot.hist { background: var(--rose); box-shadow: 0 0 0 3px rgba(255,113,137,.12); }
.dot.derived { background: var(--steel); box-shadow: 0 0 0 3px rgba(139,166,201,.12); }

.sparkbars { display: flex; align-items: center; gap: 2px; height: 26px; }
.sparkbars i { width: 4px; border-radius: 1px; display: block; }
.sparkbars i.p { background: var(--steel); }
.sparkbars i.n { background: #6b7c92; }

.empty {
  border: 1px dashed var(--line-2); border-radius: var(--r); padding: 26px;
  text-align: center; color: var(--ink-3); font-size: 13px;
}
.empty strong { color: var(--ink-2); font-weight: 600; }

/* ---------------------------------------------------------------- graph */
.graph-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background:
  linear-gradient(180deg, #10151b, #0c1015); padding: 6px; }
svg.graphdefs { position: absolute; width: 0; height: 0; }
svg.g { display: block; }
.g .edge { fill: none; stroke: #33404f; stroke-width: 1.4; }
.g .edge.live { stroke: #41546a; }
.g .edge.dead { stroke: rgba(255,113,137,.55); stroke-dasharray: 4 4; }
.g .edge.support { stroke: rgba(255,184,77,.4); }
.g .n-box { fill: #151b23; stroke: #2b3644; stroke-width: 1; }
.g .n-box.focus { fill: #1b2029; stroke: var(--accent); stroke-width: 1.5; }
.g .n-box.dim { fill: #11161c; stroke: #232c37; }
.g .n-box.bad { stroke: rgba(255,113,137,.6); }
.g g.node { cursor: pointer; }
.g g.node:not([data-act]) { cursor: default; }
.g .node:hover .n-box { stroke: var(--accent); }
.g .t1 { font-family: var(--mono); font-size: 11px; fill: #dde4ec; }
.g .t2 { font-family: var(--sans); font-size: 10px; fill: #8b97a5; }
.g .t3 { font-family: var(--mono); font-size: 9.5px; fill: #93a0ae; }
.g .t4 { font-family: var(--mono); font-size: 9.5px; fill: #7a8493; }
.g .col-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; fill: #83909f; text-transform: uppercase; }
.g .strike { text-decoration: line-through; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--ink-3); padding: 8px 4px 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 2px; border-radius: 2px; }
.legend i.solid { background: #41546a; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--rose) 0 4px, transparent 4px 8px); }
.legend i.sup { background: rgba(255,184,77,.55); }

.cols2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; align-items: start; }
@media (max-width: 1080px) { .cols2 { grid-template-columns: 1fr; } }

/* --------------------------------------------------------------- ledger */
.ledwrap { overflow-x: auto; margin: 0 -2px; }
.ledger { width: 100%; min-width: 430px; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
.ledger th {
  text-align: left; font-weight: 500; color: var(--ink-4); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .1em; padding: 0 8px 6px; border-bottom: 1px solid var(--line);
}
.ledger td { padding: 7px 8px; border-bottom: 1px solid #1a212a; vertical-align: top; }
.ledger tr.total td { border-bottom: 0; border-top: 1px solid var(--line-2); color: var(--ink); font-weight: 600; }
.ledger tr.dead td { color: var(--ink-4); }
.ledger tr.dead .op { color: var(--rose); }
.ledger .op { color: var(--ink-3); }
.ledger .why { font-family: var(--sans); color: var(--ink-3); font-size: 10.5px; display: block; margin-top: 2px; }
.vec { font-family: var(--mono); font-size: 11px; color: var(--ink-2); word-break: break-word; }
.formula {
  margin-top: 10px; padding: 9px 11px; border-radius: 8px; background: var(--bg-2);
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
}
.formula b { color: var(--accent); font-weight: 600; }

/* ----------------------------------------------------------------- list */
.plist { display: flex; flex-direction: column; gap: 1px; }
.prow {
  display: grid; grid-template-columns: 1fr auto; gap: 9px; align-items: start;
  padding: 9px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent;
  text-align: left; width: 100%; color: inherit;
}
.prow:hover { background: var(--panel-2); border-color: var(--line); }
.prow[data-withdrawn="true"] { opacity: .62; }
.prow .pid { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
.prow .pst { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.prow .meta { font-family: var(--mono); font-size: 10px; color: var(--ink-4); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.prow .right { display: flex; gap: 6px; align-items: center; }
.prow[data-withdrawn="true"] .pid { text-decoration: line-through; color: var(--ink-4); }

.kind { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .09em; padding: 2px 5px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.kind.fact { color: var(--steel); border-color: rgba(139,166,201,.35); background: rgba(139,166,201,.09); }
.kind.observation { color: var(--mint); border-color: rgba(111,227,180,.32); background: rgba(111,227,180,.08); }
.kind.rule { color: var(--violet); border-color: rgba(183,156,255,.34); background: rgba(183,156,255,.09); }
.kind.constraint { color: var(--accent); border-color: rgba(255,184,77,.34); background: rgba(255,184,77,.09); }
.kind.authority { color: var(--pink); border-color: rgba(242,162,194,.34); background: rgba(242,162,194,.09); }

/* --------------------------------------------------------------- tables */
.dtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.dtable th {
  text-align: left; padding: 7px 9px; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-4); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--panel); z-index: 1;
}
.dtable th.num, .dtable td.num { text-align: right; font-family: var(--mono); }
.dtable td { padding: 8px 9px; border-bottom: 1px solid #1a212a; vertical-align: top; }
.dtable tbody tr { cursor: pointer; }
.dtable tbody tr:hover { background: var(--panel-2); }
.dtable tbody tr.flash { background: rgba(255,184,77,.07); }
.dtable .wname { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.dtable .delta.up { color: var(--mint); }
.dtable .delta.down { color: var(--rose); }
.dtable .cause { color: var(--ink-3); font-size: 11px; }
.dtable .was { color: var(--ink-4); }
.dtable .now { color: var(--ink); }
.depth { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 7px; color: var(--ink-3); }
.depth.d0 { color: var(--rose); border-color: rgba(255,113,137,.4); }
.depth.dn { color: var(--steel); border-color: rgba(139,166,201,.4); }

.tblwrap { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: var(--r); }

/* ----------------------------------------------------------- withdrawal */
.wdlayout { display: grid; grid-template-columns: 380px 1fr; gap: 12px; align-items: start; }
@media (max-width: 980px) { .wdlayout { grid-template-columns: 1fr; } }
.picker { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px; position: sticky; top: 118px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; }
@media (max-width: 980px) { .picker { position: static; max-height: none; } }
.picker .plist { overflow: auto; margin-top: 8px; padding-right: 4px; }
.kgroup { margin-top: 10px; }
.kgroup .kh {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-4); padding: 6px 4px; display: flex; align-items: center; gap: 7px;
  border-top: 1px solid var(--line);
}
.kgroup .kh .n { margin-left: auto; }

.withdrawn-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.wtag {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px;
  border: 1px solid rgba(255,113,137,.35); background: rgba(255,113,137,.08); color: var(--rose);
  border-radius: 999px; padding: 3px 4px 3px 8px;
}
.wtag button { background: none; border: 0; color: var(--rose); padding: 0 3px; font-size: 12px; line-height: 1; opacity: .8; }
.wtag button:hover { opacity: 1; }

.diffbars { display: grid; gap: 10px; }
.db-legend { display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-bottom: 10px; }
.db-legend span { display: inline-flex; align-items: center; gap: 5px; }
.db-legend .sw { width: 14px; height: 5px; border-radius: 2px; display: inline-block; }
.db-legend .sw.before { background: #46566a; }
.db-legend .sw.after { background: var(--accent); }
.db-legend .hint { margin-left: auto; }
.db-row { display: grid; grid-template-columns: 46px minmax(60px, 1fr) 132px; gap: 10px; align-items: center; }
.db-k { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.db-tracks { display: flex; flex-direction: column; gap: 3px; }
.db-t { height: 7px; border-radius: 4px; background: #182029; position: relative; overflow: hidden; }
.db-t i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; display: block; }
.db-t i.b { background: #46566a; }
.db-t i.a { background: var(--accent); }
.db-v { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; line-height: 1.35; }
.db-v b.up { color: var(--mint); font-weight: 500; }
.db-v b.down { color: var(--rose); font-weight: 500; }
@media (max-width: 520px) { .db-row { grid-template-columns: 40px minmax(50px, 1fr) 112px; } .db-legend .hint { display: none; } }

/* --------------------------------------------------------------- modal */
.scrim {
  position: fixed; inset: 0; background: rgba(4, 6, 9, 0.72); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 90;
}
.modal {
  width: min(760px, 100%); max-height: 88vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px;
  box-shadow: var(--shadow); padding: 20px;
}
.modal h3 { margin: 0 0 4px; font-size: 16px; }
.modal .mh { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.modal .mh .x { margin-left: auto; }
.modal .mbody { display: grid; gap: 12px; }
.modal .mfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.modal .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); word-break: break-all; }
.modal .kv { display: grid; grid-template-columns: 116px 1fr; gap: 4px 12px; font-size: 12px; }
.modal .kv dt { color: var(--ink-4); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.modal .kv dd { margin: 0; color: var(--ink-2); word-break: break-word; }
.modal .cone { border: 1px solid rgba(255,113,137,.28); background: rgba(255,113,137,.05); border-radius: 9px; padding: 11px 12px; }
.modal .cone .h { font-family: var(--mono); font-size: 10.5px; color: var(--rose); letter-spacing: .06em; margin-bottom: 6px; }
.modal .cone ul { margin: 0; padding-left: 16px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.modal textarea, .notes textarea {
  width: 100%; min-height: 82px; resize: vertical; padding: 9px 10px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink);
  font-family: var(--sans); font-size: 12.5px; line-height: 1.5;
}

/* -------------------------------------------------------------- drawer */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%); z-index: 80;
  background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.drawer .dh h3 { margin: 0; font-size: 14px; }
.drawer .db { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.expl {
  border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; background: var(--bg-2);
  display: flex; flex-direction: column; gap: 7px;
}
.expl .nm { font-size: 13px; font-weight: 600; }
.expl .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
.expl .btns { display: flex; gap: 6px; margin-top: 2px; }
.expl .note { font-size: 11.5px; color: var(--ink-3); border-left: 2px solid var(--line-2); padding-left: 8px; }

/* ---------------------------------------------------------------- misc */
.notes { margin-top: 12px; }
.notes .saved { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); margin-left: auto; text-transform: none; letter-spacing: 0; }
.hint { font-size: 11.5px; color: var(--ink-4); }
.hint kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; color: var(--ink-3); }
.reasons { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-2); }
.reasons li { margin-left: 16px; }
.tryrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--raise); border: 1px solid var(--line-2); color: var(--ink);
  padding: 9px 15px; border-radius: 999px; font-size: 12.5px; z-index: 120;
  box-shadow: var(--shadow); opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
  max-width: 90vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.statusbar {
  border-top: 1px solid var(--line); background: rgba(11,14,18,.9);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-4);
  padding: 7px 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
}
.statusbar .m { color: var(--ink-3); }
.statusbar .push { margin-left: auto; }

/* ------------------------------------------------------------- about */
.about { max-width: 900px; display: flex; flex-direction: column; gap: 14px; }
.about h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin: 0 0 10px; }
.about p { margin: 0 0 10px; color: var(--ink-2); font-size: 13.5px; line-height: 1.65; }
.about ul { margin: 0 0 10px; padding-left: 18px; color: var(--ink-2); font-size: 13px; line-height: 1.6; }
.about li { margin-bottom: 5px; }
.about code { font-family: var(--mono); font-size: 11.5px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
.about .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .about .two { grid-template-columns: 1fr; } }
.about .gap { border-left: 2px solid var(--rose); padding-left: 10px; }
.about .real { border-left: 2px solid var(--mint); padding-left: 10px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<script>
/* Wide weight-space explorer — derivation engine.
 *
 * Ports the standing / support / retraction rules of Idol core profile 1
 * (clpi/idol-wide spec.md sections 1-6, clpi/idol-wsp Idol-Weights-Semantics.md)
 * onto the mock session in seed.json. Every number is exact integer arithmetic
 * in micro-units (1e-6), so the browser and verify.mjs cannot drift.
 *
 * Rules implemented:
 *   support(x)      = transitive premise closure over required dependency edges
 *   live(event)     = every premise in support(event) admitted and unwithdrawn
 *   snapshot(w)     = anchor + sum of live deltas (held), or relation of deps (derived)
 *   usable(w)       = no withdrawn premise in support(w)

    var m = frac >= 0.5 ? r + 1 : r;

        events.set(rec.id, rec);
        eventOrder.push(rec);

    /* ---------------------------------------------------------- support */
    var supportCache = new Map();

          throw new Error('unresolved citation: ' + c);
        }
        support(c).forEach(function (x) { set.add(x); });
      });
    }

    function support(id) {
      if (supportCache.has(id)) return supportCache.get(id);
      var set = new Set();
      var p = premises.get(id);
      if (p) {
        set.add(id);
        if (p.derivation && p.derivation.cites) citeSupport(p.derivation.cites, set);
      } else if (weights.has(id)) {

        if (w.kind === 'held') {
